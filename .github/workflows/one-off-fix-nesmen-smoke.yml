name: One-off fix Nesměň smoke coordinates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Align smoke tests with current Lesník position
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/game-smoke.spec.mjs')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'window.__lovecDebug.setPlayer(290,980);': 'window.__lovecDebug.setPlayer(390,880);',
              'window.__lovecDebug.setPlayer(300, 990)': 'window.__lovecDebug.setPlayer(390, 880)',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, got {count}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/one-off-fix-nesmen-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/game-smoke.spec.mjs .github/workflows/one-off-fix-nesmen-smoke.yml
          git commit -m "test: align Nesměň ranger coordinates"
          git push origin HEAD:main
