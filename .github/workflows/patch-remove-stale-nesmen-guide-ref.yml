name: One-off remove stale Nesměň guide reference

on:
  push:
    branches:
      - agent/remove-stale-nesmen-guide-ref

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remove-stale-nesmen-guide-ref
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Remove stale script reference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          target = '<script src="./nesmen-guide.js"></script>\n'
          if text.count(target) != 1:
              raise SystemExit(f'stale reference count={text.count(target)}')
          path.write_text(text.replace(target, '', 1), encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run validate
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove stale Nesměň guide script reference"
          git push origin HEAD:agent/remove-stale-nesmen-guide-ref
