name: One-off Karel 3s patch
on:
  push:
    branches: [agent/prodlouzit-karel-action-window]
    paths: [.github/workflows/patch-karel-3s.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prodlouzit-karel-action-window
          fetch-depth: 0
      - name: Set Karel action window to 3 seconds
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('game.js')
          s = p.read_text()
          old = 'r.stunTimer=1.8;r.target={x:rand(240,1560),y:rand(180,980)};toast("KAREL SE ZASTAVIL · TEĎ!","good",1800);'
          new = 'r.stunTimer=3;r.target={x:rand(240,1560),y:rand(180,980)};toast("KAREL SE ZASTAVIL · TEĎ!","good",3000);'
          assert s.count(old) == 1, f'Expected exactly one Karel timing occurrence, found {s.count(old)}'
          p.write_text(s.replace(old, new))

          p = Path('sw.js')
          s = p.read_text()
          assert s.count('lovec-vltavinu-reborn-v5-4-2-runtime-39') == 1
          p.write_text(s.replace('lovec-vltavinu-reborn-v5-4-2-runtime-39', 'lovec-vltavinu-reborn-v5-4-2-runtime-40'))

          p = Path('tests/offline-smoke.spec.mjs')
          s = p.read_text()
          assert s.count('lovec-vltavinu-reborn-v5-4-2-runtime-39') == 1
          p.write_text(s.replace('lovec-vltavinu-reborn-v5-4-2-runtime-39', 'lovec-vltavinu-reborn-v5-4-2-runtime-40'))
          PY
      - name: Commit final result and remove one-off workflow
        run: |
          rm .github/workflows/patch-karel-3s.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Set Karel action window to 3 seconds"
          git push origin HEAD:agent/prodlouzit-karel-action-window
